name: Deploy to Azure Web App - Linux

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ScrappingManagement.Web/ScrappingManagement.Web.csproj

      - name: Build
        run: dotnet build ScrappingManagement.Web/ScrappingManagement.Web.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ScrappingManagement.Web/ScrappingManagement.Web.csproj --configuration Release --output ./publish --no-build

      - name: Remove appsettings files from publish
        run: |
          # remove appsettings.json and any environment variants from the publish output
          find ./publish -maxdepth 1 -type f -name 'appsettings*.json' -print -exec rm -f {} \;
        shell: bash

      - name: Deploy to Azure Web App (Linux)
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'AmbitScrapeMgt'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish